    sdk: flutter
  media_kit: 1.2.6
  media_kit_libs_windows_video: 1.0.11
  media_kit_video: 2.0.1
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
