name: dhara
description: Personal BDIX desktop streaming client (Windows first, portable to macOS/Linux).
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.10.0

# Versions are pinned exactly (BRIEF section 7); pubspec.lock is committed.
dependencies:
  ffi: 2.2.0
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  html: 0.15.7
  media_kit: 1.2.6
  media_kit_libs_windows_video: 1.0.11
  media_kit_video: 2.0.1
  path_provider_platform_interface: 2.1.3
  shared_preferences: 2.5.6
  sqlite3: 3.9.1
  win32: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sources/starter_sources.json

  # Bundled, never fetched at runtime. Variable fonts: one file per family
  # covers every weight. Sources and checksums: assets/fonts/README.md
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Variable.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Variable.ttf
