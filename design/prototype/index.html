<style id="design-tokens">
:root {
  /* colour */
  --bg: #06070c;  --bg-elev: #0d0f18;

  --glass: rgba(12, 14, 24, .58);       --glass-strong: rgba(13, 15, 24, .84);
  --stroke: rgba(255, 255, 255, .10);   --stroke-strong: rgba(255, 255, 255, .24);
  --text: #f2f4fb;  --text-2: #aab0c6;  --text-3: #6d748c;
  --accent: #8b6cff;  --accent-2: #2ad4f0;
  --accent-grad: linear-gradient(135deg, #8b6cff 0%, #2ad4f0 100%);
  --accent-soft: linear-gradient(135deg, rgba(139, 108, 255, .42), rgba(42, 212, 240, .22));
  --on-accent: #ffffff;
  --good: #3ddc97;  --warn: #ffc04d;  --bad: #ff5d6c;

  /* typography. PROTOTYPE NOTE: system fonts stand in for the fonts that will
     be bundled in the Flutter app (Inter / Plus Jakarta Sans). Nothing is fetched. */
  --font-ui: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "Plus Jakarta Sans", "Inter", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
  --fs-xs: .72rem;  --fs-sm: .82rem;  --fs-md: .95rem;  --fs-lg: 1.2rem;
  --fs-xl: 1.5rem;  --fs-2xl: 2.25rem;
  --fs-display: clamp(2.6rem, 4.4vw, 5.6rem);
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700; --fw-black: 800;
  --lh-tight: 1.02; --lh-snug: 1.3; --lh-body: 1.55;
  --display-tracking: -.035em;

  /* spacing (rem scales with window width, see html font-size below) */
  --sp-1: .25rem;  --sp-2: .5rem;   --sp-3: .75rem;  --sp-4: 1rem;
  --sp-5: 1.5rem;  --sp-6: 2rem;    --sp-7: 3rem;    --sp-8: 4rem;

  /* radii */
  --r-sm: .5rem;  --r-md: .875rem;  --r-lg: 1.25rem;  --r-pill: 999px;

  /* elevation */
  --blur: 1.4rem;
  --shadow-card: 0 .6rem 1.6rem rgba(0, 0, 0, .45);
  --shadow-pop: 0 1.5rem 4rem rgba(0, 0, 0, .6);
  --glow: 0 0 0 1px rgba(139, 108, 255, .7), 0 .9rem 2.6rem rgba(99, 102, 241, .5);
  --focus-ring: 0 0 0 .2rem rgba(139, 108, 255, .28);

  /* motion */
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --dur-fast: 120ms;  --dur-base: 220ms;  --dur-slow: 420ms;  --dur-hero: 900ms;
  --hero-interval: 9s;
  --hover-scale: 1.06;

  /* layout */
  --titlebar-h: 2.75rem;
  --page-l: 6.25rem;  --page-r: 3rem;
  --gap-card: 1rem;
  --w-poster: 11.25rem;  --w-wide: 20rem;
}

<style>
/* ============================ base ============================ */
* { box-sizing: border-box; margin: 0; }

body { height: 100vh; overflow: hidden; background: var(--bg); color: var(--text);
       font-family: var(--font-ui); font-size: var(--fs-md); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { width: 1.25rem; height: 1.25rem; flex: none; }

.window { position: relative; height: 100vh; overflow: hidden; isolation: isolate; }
.window::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;   /* ambient aurora */
  background: radial-gradient(60rem 36rem at 105% 60%, rgba(42, 212, 240, .07), transparent 60%),

            transition: background var(--dur-base), border-color var(--dur-base); }

.status-chip:hover { background: var(--surface-2); }

.status-chip b { color: var(--text); font-weight: 600; }
.icon-btn { width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: var(--r-sm); color: var(--text-2);
            transition: background var(--dur-fast), color var(--dur-fast); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* floating glass navigation rail */
.rail { position: absolute; left: .85rem; top: calc(var(--titlebar-h) + .6rem); bottom: .85rem; width: 3.6rem; z-index: 50;
        display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: .6rem 0; border-radius: var(--r-lg);
        background: var(--glass); border: 1px solid var(--stroke); backdrop-filter: blur(var(--blur)) saturate(1.5); box-shadow: var(--shadow-card); }
.rail-btn { position: relative; width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: var(--r-md); color: var(--text-2);
            transition: background var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-base); }

.rail-btn.on { color: #fff; background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), 0 .4rem 1.2rem rgba(99, 102, 241, .4); }
.rail-btn::after { content: attr(data-label); position: absolute; left: calc(100% + .8rem); top: 50%; transform: translate(-.3rem, -50%);
                   padding: .3rem .6rem; border-radius: var(--r-sm); background: var(--bg-elev); border: 1px solid var(--stroke); font-size: var(--fs-xs);

.rail-sep { flex: 1; }

/* ====================== buttons, chips, controls ====================== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 2.9rem; padding: 0 1.4rem; border-radius: var(--r-pill);

.chip:hover { background: var(--surface-2); color: var(--text); }

.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transform: scale(1.08);

  background: linear-gradient(90deg, var(--bg) 0%, rgba(6, 7, 12, .78) 26%, transparent 62%), linear-gradient(0deg, var(--bg) 0%, rgba(6, 7, 12, .55) 22%, transparent 50%); }

         background-size: cover; background-position: center; transition: opacity var(--dur-base), transform var(--dur-base) var(--ease-out), border-color var(--dur-base); }

.rows { margin-top: -4.6rem; position: relative; z-index: 4; }

/* ============================== rows ============================== */

.row-all:hover { color: var(--text); gap: .35rem; }

             font-size: .86rem; line-height: 1.15; letter-spacing: .14em; text-transform: uppercase; text-wrap: balance; text-shadow: 0 .1rem .6rem rgba(0, 0, 0, .7);
             transition: opacity var(--dur-fast); }

.peek { position: absolute; inset: auto 0 0 0; z-index: 3; padding: .65rem .7rem .7rem; background: rgba(10, 12, 22, .66); backdrop-filter: blur(1rem) saturate(1.4);

/* ========================= generic page layout ========================= */

/* ============================ title details ============================ */

/* copies list */

mark { background: none; color: var(--accent-2); }

.hist { display: grid; grid-template-columns: 12rem minmax(0, 1fr) auto; gap: 1.2rem; align-items: center; padding: .55rem .9rem .55rem .55rem; border-radius: var(--r-md);
        border: 1px solid transparent; cursor: pointer; transition: background var(--dur-fast), border-color var(--dur-fast); }

           padding: .7rem 1.1rem; border-top: 1px solid var(--stroke); font-size: var(--fs-sm); transition: background var(--dur-fast); }

             transition: transform var(--dur-fast); box-shadow: 0 0 0 .3rem rgba(139, 108, 255, .35); pointer-events: none; }

            font-size: var(--fs-xs); font-variant-numeric: tabular-nums; opacity: 0; pointer-events: none; transition: opacity var(--dur-fast); }

/* =====================================================================
   Generated placeholder artwork: deterministic SVG from a string.
   ===================================================================== */
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const artCache = new Map();
function art(seedText, shape) {
  const key = shape + '|' + seedText;
  if (artCache.has(key)) return artCache.get(key);
  const wide = shape === 'wide', W = wide ? 960 : 400, H = wide ? 540 : 600;
  const r = rng(hash(seedText)), n = (v) => v.toFixed(1);
  const cine = (h) => (h >= 50 && h <= 160 ? (h + 135) % 360 : h);               // steer away from yellow-green: reads cheap on dark UIs
  const h1 = cine(Math.floor(r() * 360)), h2 = cine((h1 + 20 + Math.floor(r() * 70)) % 360), h3 = cine((h1 + 150 + Math.floor(r() * 90)) % 360);
  const motif = Math.floor(r() * 5);
  const fx = wide ? .6 + r() * .22 : .28 + r() * .44, fy = .22 + r() * .24;      // focal point (kept right on wide art so text stays readable)
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>` +
    `<linearGradient id="g" x1="0" y1="0" x2="${r() > .5 ? 1 : 0}" y2="1"><stop offset="0" stop-color="hsl(${h1} 58% 24%)"/><stop offset="1" stop-color="hsl(${h2} 70% 6%)"/></linearGradient>` +
    `<radialGradient id="o" cx="${n(fx)}" cy="${n(fy)}" r=".62"><stop offset="0" stop-color="hsl(${h3} 90% 58%)" stop-opacity=".62"/><stop offset="1" stop-color="hsl(${h3} 90% 58%)" stop-opacity="0"/></radialGradient>` +
    `<radialGradient id="sun" cx=".4" cy=".36" r=".75"><stop offset="0" stop-color="hsl(${h3} 100% 93%)"/><stop offset=".55" stop-color="hsl(${h3} 96% 72%)"/><stop offset="1" stop-color="hsl(${h3} 88% 52%)"/></radialGradient>` +
    `<radialGradient id="halo"><stop offset=".35" stop-color="hsl(${h3} 96% 70%)" stop-opacity=".5"/><stop offset="1" stop-color="hsl(${h3} 96% 70%)" stop-opacity="0"/></radialGradient>` +
    `</defs><rect width="${W}" height="${H}" fill="url(#g)"/><rect width="${W}" height="${H}" fill="url(#o)"/>`;
  const cx = W * fx, cy = H * fy;
  const sun = (x, y, rad) => `<circle cx="${n(x)}" cy="${n(y)}" r="${n(rad * 2.4)}" fill="url(#halo)"/><circle cx="${n(x)}" cy="${n(y)}" r="${n(rad)}" fill="url(#sun)"/>`;
  if (motif !== 2) for (let i = 0; i < 46; i++)        // stars
    s += `<circle cx="${n(r() * W)}" cy="${n(r() * H * .6)}" r="${n(.5 + r() * 1.2)}" fill="#fff" opacity="${n(.15 + r() * .6)}"/>`;
  if (motif === 0) {                                   // horizon: sun + layered hills
    s += sun(cx, cy + H * .1, H * (wide ? .12 : .1));
    [[.56, 30, 16], [.68, 26, 10], [.8, 22, 5]].forEach(([y, sat, l]) => {
      let d = `M0 ${H}L0 ${n(H * y)}`;
      for (let i = 1; i <= 4; i++) { const x = W * i / 4; d += `Q${n(x - W / 8)} ${n(H * (y + (r() - .5) * .16))} ${n(x)} ${n(H * (y + (r() - .5) * .07))}`; }
      s += `<path d="${d}L${W} ${H}Z" fill="hsl(${h2} ${sat}% ${l}%)"/>`;
    });
  } else if (motif === 1) {                            // orbit: rings + planet
    for (let i = 1; i <= 6; i++) s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(H * .09 * i)}" fill="none" stroke="#fff" stroke-opacity="${n(.34 - i * .045)}" stroke-width="1.5"/>`;
    s += sun(cx, cy, H * .1) + `<circle cx="${n(cx + H * .27)}" cy="${n(cy + H * .05)}" r="${n(H * .02)}" fill="#fff"/>`;
  } else if (motif === 2) {                            // shards
    for (let i = 0; i < 9; i++) {
      const px = cx + (r() - .5) * W * .9, py = cy + (r() - .3) * H * .9, sz = H * (.12 + r() * .3), a = r() * 6.28;
      const p = [0, 2.1, 4.2].map((o) => `${n(px + Math.cos(a + o) * sz)},${n(py + Math.sin(a + o) * sz * (0.5 + r()))}`).join(' ');
      s += `<polygon points="${p}" fill="hsl(${i % 2 ? h3 : h1} 85% ${n(55 + r() * 20)}%)" opacity="${n(.1 + r() * .26)}"/>`;
    }
  } else if (motif === 3) {                            // city skyline
    s += sun(cx, cy, H * .075);
    for (let x = -10; x < W;) {
      const bw = (wide ? 34 : 26) + r() * (wide ? 70 : 46), bh = H * (.16 + r() * .36);
      s += `<rect x="${n(x)}" y="${n(H - bh)}" width="${n(bw)}" height="${n(bh)}" fill="hsl(${h2} 45% ${n(4 + r() * 5)}%)"/>`;
      for (let k = 0; k < 5; k++) if (r() > .45) s += `<rect x="${n(x + 5 + r() * (bw - 14))}" y="${n(H - bh + 8 + r() * (bh - 20))}" width="4" height="6" fill="hsl(${h3} 95% 72%)" opacity="${n(.5 + r() * .5)}"/>`;
      x += bw + 2;
    }
  } else {                                             // waves under a low moon
    s += sun(cx, H * .4, H * .06);
    for (let i = 0; i < 7; i++) {
      const y = H * (.42 + i * .085), amp = H * (.02 + r() * .035), ph = r() * 6.28; let d = `M0 ${H}L0 ${n(y)}`;
      for (let x = 0; x <= W; x += W / 16) d += `L${n(x)} ${n(y + Math.sin(x / W * 9 + ph) * amp)}`;
      s += `<path d="${d}L${W} ${H}Z" fill="hsl(${(h2 + i * 6) % 360} 60% ${24 - i * 3}%)" opacity=".7"/>`;
    }
  }
  s += '</svg>';
  const url = `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
  artCache.set(key, url);
  return url;
}

/* =====================================================================
   Screen: Search (instant, with filters). Also used for Movies / Series / Anime browsing.
   ===================================================================== */
const defaultF = () => ({ q: '', type: 'All', quality: 'Any', year: 'Any', min: 0, genres: [], sort: 'Relevance' });
let F = defaultF();
const GENRES = [...new Set(ALL.flatMap((t) => t.genres.split(' · ')))].sort();
function runSearch() {
  const t0 = performance.now(), words = F.q.toLowerCase().trim().split(/\s+/).filter(Boolean), out = [];
  for (const t of ALL) {
    if (F.type !== 'All' && t.type !== F.type) continue;
    if (F.quality !== 'Any' && t.q !== F.quality) continue;
    if (F.year !== 'Any' && (F.year === 'Older' ? t.year > 2022 : t.year !== +F.year)) continue;
    if (t.rating < F.min) continue;
    const g = t.genres.split(' · ');
    if (!F.genres.every((x) => g.includes(x))) continue;
    const hay = t.title.toLowerCase(), hay2 = (t.genres + ' ' + t.type).toLowerCase();
    let score = 0, ok = true;
    for (const w of words) {
      if (hay.startsWith(w)) score += 4; else if (hay.includes(' ' + w)) score += 3; else if (hay.includes(w)) score += 2; else if (hay2.includes(w)) score += 1; else { ok = false; break; }
    }
    if (ok) out.push([score, t]);
  }
  const by = { Relevance: (a, b) => b[0] - a[0] || b[1].rating - a[1].rating, Rating: (a, b) => b[1].rating - a[1].rating,
    Newest: (a, b) => b[1].year - a[1].year || b[1].rating - a[1].rating, 'A–Z': (a, b) => a[1].title.localeCompare(b[1].title) };
  out.sort(by[F.sort] || by.Relevance);
  return { list: out.map((x) => x[1]), ms: performance.now() - t0 };
}
const fChip = (k, v, label = v) => `<button class="chip sm ${String(F[k]) === String(v) ? 'on' : ''}" data-act="f" data-k="${k}" data-v="${esc(v)}">${esc(label)}</button>`;
function searchInner() {
  const { list, ms } = runSearch();
  const title = F.q.trim() ? `Results for “${esc(F.q.trim())}”` : F.type === 'All' ? 'Browse everything' : { Movie: 'Movies', Series: 'Series', Anime: 'Anime' }[F.type];
  const dirty = JSON.stringify({ ...F, q: '' }) !== JSON.stringify(defaultF());
  return `<div class="page-head"><div><h1 class="page-title">${title}</h1>
      <p class="page-sub result-info"><b>${list.length}</b> of ${ALL.length} titles · searched in <b>${ms < .1 ? 'under 0.1' : ms.toFixed(1)} ms</b> · results update as you type</p></div>
      <div class="page-actions">${dirty ? `<button class="btn sm glass" data-act="f-reset">${icon('x')}Reset filters</button>` : ''}</div></div>

        <span class="f-label" style="width:auto;margin-left:1.5rem">Sort</span>${['Relevance', 'Rating', 'Newest', 'A–Z'].map((v) => fChip('sort', v)).join('')}</div>
      <div class="f-row"><span class="f-label">Quality</span>${['Any', '4K', '1080p', '720p'].map((v) => fChip('quality', v)).join('')}
        <span class="f-label" style="width:auto;margin-left:1.5rem">Rating</span>${[[0, 'Any'], [7, '7+'], [8, '8+']].map(([v, l]) => fChip('min', v, l)).join('')}
        <span class="f-label" style="width:auto;margin-left:1.5rem">Year</span>${['Any', '2025', '2024', '2023', 'Older'].map((v) => fChip('year', v, v === 'Older' ? '2022 & older' : v)).join('')}</div>
      <div class="f-row"><span class="f-label">Genre</span>${GENRES.map((g) => `<button class="chip sm ${F.genres.includes(g) ? 'on' : ''}" data-act="f-genre" data-v="${esc(g)}">${esc(g)}</button>`).join('')}</div>
    </div>
    ${list.length ? `<div class="grid">${list.map((t) => posterCard(t)).join('')}</div>`
      : `<div class="empty">${icon('search')}<b>Nothing matches</b>Try a shorter query or remove a filter.</div>`}`;

const refreshDisc = () => { if (R.name === 'discovery') $('discInner').innerHTML = discInner(); statusChip(); };
function testAll() {
  if (D.testing) return;
  D.testing = true; D.done = 0;
  SRV.forEach((s) => { s.state = 'wait'; });
  refreshDisc();
  SRV.forEach((s, i) => setTimeout(() => {                      // all candidates are tested in parallel; dead ones hit the timeout
    s.state = s.ok ? 'ok' : 'bad'; s.tested = 'just now';
    if (s.ok) s.live = Math.max(3, s.ping + Math.floor(Math.random() * 7) - 3); else s.enabled = false;
    D.done++;
    if (D.done === SRV.length) { D.testing = false; toast(`Test finished: <b>${SRV.filter((x) => x.ok).length} reachable</b>, ${SRV.filter((x) => !x.ok).length} unreachable from your connection.`); }

  }, s.ok ? 350 + hash(s.name) % 1400 : 2600 + i * 45));
}

  const el = ev.target.closest('[data-act], [data-go], [data-hero], .row-nav');
  if (!el) return;
  if (el.classList.contains('row-nav')) { const track = el.parentElement.querySelector('.track'); track.scrollBy({ left: (el.classList.contains('next') ? 1 : -1) * track.clientWidth * .8 }); return; }
  if (el.dataset.hero !== undefined) { setHero(+el.dataset.hero); return; }
  if (el.dataset.go) { go(el.dataset.go); if (el.dataset.go === '#/search') $('q').focus(); return; }
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, ev);
});

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'q') {                                               // instant search from anywhere
    F.q = el.value;
    if (R.name !== 'search') { go('#/search'); return; }
    if (NAV.stack[NAV.i] !== '#/search') { NAV.stack[NAV.i] = '#/search'; mirror('replaceState', '#/search'); R.raw = '/search'; }
    refreshSearch();
  } else if (el.dataset.stepInput) {                                 // custom seek step, 1 to 600 s
    const v = clamp(Math.round(+el.value) || 0, 0, 600);
    if (v < 1) return;
    S[el.dataset.stepInput] = v; save();
    el.closest('.step-chips').querySelectorAll('button.chip').forEach((b) => b.classList.toggle('on', +b.dataset.val === v));
    el.parentElement.classList.toggle('on', !STEP_PRESETS.includes(v));
    if (R.name === 'play') syncCtl();
  } else if (el.id === 'plVol') { P.vol = +el.value; P.muted = false; syncMute(); }
  else if (el.dataset.key) {
    S[el.dataset.key] = el.type === 'range' ? +el.value : el.value; save();
    const out = el.parentElement.querySelector('output');
    if (out) out.textContent = el.value + (el.dataset.unit || '');
    applySettings(); applySub();
  }
});

document.addEventListener('keydown', (ev) => {
  const tag = ev.target.tagName, typing = (tag === 'INPUT' && ev.target.type !== 'range') || tag === 'SELECT';
  if (R.name === 'play') { if (!typing) playerKey(ev); return; }
  if (((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') || (ev.key === '/' && !typing)) { ev.preventDefault(); $('q').focus(); $('q').select(); return; }
  if (ev.key === 'Escape') { if ($('sheet').classList.contains('open')) closeSheet(); else if (ev.target.id === 'q') ev.target.blur(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && !typing && ev.target.matches('[data-go][tabindex]')) { ev.preventDefault(); go(ev.target.dataset.go); }
});

player.addEventListener('mousemove', wake);
main.addEventListener('scroll', () => titlebar.classList.toggle('scrolled', main.scrollTop > 24), { passive: true });

mountShell(); applySettings(); statusChip(); mirror('replaceState', NAV.stack[0]); route();
</script>
</body>
</html>
